<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SponyFly</title>
    <link rel="icon" type="image/x-icon" href="./img/favicon-32x32.png" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/header.css" />
    <link rel="stylesheet" href="./styles/footer.css" />
    <link rel="stylesheet" href="./styles/index.css" />
  </head>
  <body>
    <header class="header">
      <a href="./index.html" class="logo-container-wrapper-link">
        <div class="logo-container">
          <img
            src="https://cdn.builder.io/api/v1/image/assets/TEMP/557708213e16d22ecc34a7233059db5e52b177b5802c3147ee7027764a20aad9?placeholderIfAbsent=true&apiKey=0ee8a97a29544de7a3bd04cbc1242992"
            alt="SponyFly logo"
            class="logo-image"
          />
          <span class="company-name">SponyFly</span>
        </div>
      </a>

      <nav class="nav-list">
        <a href="#" class="nav-item">About</a>
        <a href="#" class="nav-item">Contacts</a>
        <div class="auth-buttons">
          <button
            onclick="window.location.href = './login.html'"
            class="signin-btn"
          >
            Sign in
          </button>
          <button
            onclick="window.location.href = './register.html'"
            class="register-btn"
          >
            Register
          </button>
        </div>
      </nav>
    </header>

    <main class="main-content">
      <div class="hero-section">
        <img
          loading="lazy"
          src="./img/photo-1436491865332-7a61a109cc05.jfif"
          class="hero-background"
          alt=""
        />
        <div class="hero-ui">
          <div class="hero-content">
            <h1 class="hero-title">Enter a city to fly from</h1>
            <p class="hero-subtitle">Your life should be a bit spontaneous</p>
          </div>
          <div class="search-container">
            <form class="search-form" role="search">
              <input
                type="search"
                id="citySearch"
                class="search-input"
                placeholder="Search your city"
                aria-label="Search your city"
              />
              <a href="./search_result.html"
                ><img
                  loading="lazy"
                  src="https://cdn.builder.io/api/v1/image/assets/TEMP/aba6740383da6cb051f1e2387774c15ee93a60ddec164913ca45ace6a6385756?placeholderIfAbsent=true&apiKey=0ee8a97a29544de7a3bd04cbc1242992"
                  class="search-icon"
                  alt="Search"
              /></a>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">2025 SponyFly | All rights reserved</footer>
  </body>
</html>
