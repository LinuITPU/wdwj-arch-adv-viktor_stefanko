<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SponyFly</title>
    <link rel="icon" type="image/x-icon" href="./img/favicon-32x32.png" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/header.css" />
    <link rel="stylesheet" href="./styles/footer.css" />
    <link rel="stylesheet" href="./styles/breadcrumbs.css" />
    <link rel="stylesheet" href="./styles/reglog.css" />
  </head>
  <body>
    <header class="header">
      <a href="./index.html" class="logo-container-wrapper-link">
        <div class="logo-container">
          <img
            src="https://cdn.builder.io/api/v1/image/assets/TEMP/557708213e16d22ecc34a7233059db5e52b177b5802c3147ee7027764a20aad9?placeholderIfAbsent=true&apiKey=0ee8a97a29544de7a3bd04cbc1242992"
            alt="SponyFly logo"
            class="logo-image"
          />
          <span class="company-name">SponyFly</span>
        </div>
      </a>

      <nav class="nav-list">
        <a href="#" class="nav-item">About</a>
        <a href="#" class="nav-item">Contacts</a>
      </nav>
    </header>
    <section class="breadcrumbs">
      <a href="./index.html">SponyFly</a> &gt; Login
    </section>
    <main class="main-content">
      <div class="form-container">
        <label for="email" class="form-lbl"
          >Enter your Email:
          <br />
          <input type="email" id="email" placeholder="example@example.com" />
        </label>

        <label class="form-lbl" for="password"
          >Enter your Password:
          <br />
          <input type="password" id="password" placeholder="********" />
        </label>

        <div class="btns-container">
          <button
            class="register-btn"
            onclick="window.location.href = './index.html'"
          >
            Login
          </button>
          <br />
          <button
            onclick="window.location.href = './register.html'"
            class="login-btn"
          >
            <span>Or Register</span>
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">2025 SponyFly | All rights reserved</footer>
  </body>
</html>
